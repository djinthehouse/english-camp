<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFF4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101820" media="(prefers-color-scheme: dark)">
<meta name="description" content="초등 고학년~중학 영어 학습 게임 — 교과서 핵심 단어 576개, 문장 192개, be동사부터 관계대명사까지 문법 12단원. 간격 반복 복습으로 매일 조금씩.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23EF6B45'/%3E%3Ctext x='50' y='73' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EEC%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Camp">
<meta property="og:title" content="English Camp — 영어 캠프">
<meta property="og:description" content="초등 고학년부터 중학까지, 하루 5분 영어 학습 게임.">
<meta property="og:type" content="website">
<title>English Camp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Fredoka:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* ---- tokens: light (default) ---- */
:root{
  --paper:#EFF4F7;
  --paper-2:#FFFFFF;
  --paper-3:#E0E9EF;
  --line:#CFDBE3;
  --ink:#16212E;
  --ink-2:#465768;
  --ink-3:#7D8E9E;
  --ai:#16607F;
  --ai-2:#1E7EA4;
  --ai-soft:#DDEDF4;
  --shu:#EF6B45;
  --shu-2:#C74C2A;
  --shu-soft:#FDEAE2;
  --gold:#B8871B;
  --stone:#C2D0D9;
  --on-accent:#FFFFFF;
  --band:#16607F;
  --band-2:#0E4459;
  --on-band:#FFFFFF;
  --drop:rgba(22,33,46,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101820;
    --paper-2:#18222C;
    --paper-3:#212D39;
    --line:#2E3D4B;
    --ink:#E8EEF3;
    --ink-2:#AFBECA;
    --ink-3:#7A8B99;
    --ai:#5FC0E0;
    --ai-2:#3E90B0;
    --ai-soft:#17303B;
    --shu:#FF8462;
    --shu-2:#C55839;
    --shu-soft:#33211B;
    --gold:#D6B155;
    --stone:#33424E;
    --on-accent:#0C141B;
    --band:#1B4E63;
    --band-2:#123745;
    --on-band:#D2ECF4;
    --drop:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#101820;
  --paper-2:#18222C;
  --paper-3:#212D39;
  --line:#2E3D4B;
  --ink:#E8EEF3;
  --ink-2:#AFBECA;
  --ink-3:#7A8B99;
  --ai:#5FC0E0;
  --ai-2:#3E90B0;
  --ai-soft:#17303B;
  --shu:#FF8462;
  --shu-2:#C55839;
  --shu-soft:#33211B;
  --gold:#D6B155;
  --stone:#33424E;
  --on-accent:#0C141B;
  --band:#1B4E63;
  --band-2:#123745;
  --on-band:#D2ECF4;
  --drop:rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
.jp{font-family:"Fredoka","Noto Sans KR",sans-serif;letter-spacing:.01em}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---------------- top bar ---------------- */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line);padding:12px 18px;
  display:flex;align-items:center;gap:14px;
}
.stat{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700}
.stat svg{width:19px;height:19px;display:block}
.stat.streak{color:var(--shu)}
.stat.xp{color:var(--gold)}
.spacer{flex:1}
.iconbtn{
  background:none;border:1px solid var(--line);border-radius:9px;
  width:34px;height:34px;display:grid;place-items:center;padding:0;color:var(--ink-2);
}
.iconbtn svg{width:17px;height:17px}
.iconbtn:hover{background:var(--paper-3)}

/* ---------------- home ---------------- */
.hero{padding:28px 20px 6px;text-align:center}
.hero .seal{
  width:66px;height:66px;margin:0 auto 14px;border-radius:15px;
  background:var(--shu);color:var(--paper-2);display:grid;place-items:center;
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:32px;font-weight:700;
  box-shadow:0 6px 0 var(--shu-2);transform:rotate(-4deg);
}
.hero h1{margin:0;font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:26px;font-weight:700;letter-spacing:.05em}
.hero .tag{margin:8px 0 0;color:var(--ink-3);font-size:12.5px;letter-spacing:.02em}

.path{padding:6px 18px 44px}
.unitband{
  margin:26px 0 2px;padding:14px 16px;border-radius:14px;
  background:var(--band);color:var(--on-band);
  box-shadow:0 4px 0 var(--band-2);display:flex;align-items:center;gap:13px;
}
.unitband .num{
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:22px;opacity:.6;line-height:1;
  border-right:1px solid currentColor;padding-right:13px;
}
.unitband .ub-t{flex:1;min-width:0}
.unitband .t{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:16px;font-weight:700;line-height:1.35}
.gbtn{flex:none;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);
  color:var(--on-band);border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.gbtn:active{transform:translateY(1px)}

.gwrap{min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.gtop{flex:1;padding:34px 22px 20px;overflow-y:auto}
.gkicker{color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.gtitle{font-size:22px;line-height:1.35;margin:10px 0 0;letter-spacing:-.3px}
.gbody{color:var(--ink-2);font-size:14.5px;line-height:1.75;margin:12px 0 0}
.gexlist{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.gex{border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--paper-2);cursor:pointer}
.gex:active{transform:translateY(1px)}
.gj{font-size:18px;line-height:1.5}
.gm{color:var(--ink-2);font-size:13px;margin-top:5px;line-height:1.5}
.bksec{margin-top:26px}
.bklab{font-weight:800;font-size:14px;color:var(--ink)}
.bkmeta{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.bkbox{width:100%;box-sizing:border-box;margin-top:9px;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--paper-2);color:var(--ink-2);font-size:11.5px;line-height:1.55;
  resize:vertical;word-break:break-all}
.bkrow{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap}
.bkbtn{border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:11px;
  padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.bkbtn:active{transform:translateY(1px)}
.bkbtn.danger{border-color:var(--shu);color:var(--shu)}
.bkmsg{color:var(--ink-3);font-size:12px;margin-top:8px;line-height:1.55}
.bkmsg.bad{color:var(--shu)}
.authwarn{margin-top:22px;padding:13px 15px;border-radius:13px;border:1.5px solid var(--shu);
  background:var(--shu-soft);color:var(--ink);font-size:12.5px;line-height:1.65}
.acctrow{display:flex;align-items:center;gap:10px;margin:4px 0 2px;padding:12px 14px;
  border:1.5px solid var(--line);border-radius:14px;background:var(--paper-2)}
.acctrow .who{flex:1;min-width:0}
.acctrow .nm{font-weight:800;font-size:13.5px;color:var(--ink)}
.acctrow .st{color:var(--ink-3);font-size:11.5px;margin-top:2px;line-height:1.45}
.acctrow .act{flex:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:10px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.acctrow .act:active{transform:translateY(1px)}
.homefoot{padding:34px 20px 30px;text-align:center}
.finishwrap{justify-content:flex-start;padding:0;min-height:100dvh}
.finishinner{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:34px 24px 20px;text-align:center;max-width:460px;margin:0 auto;width:100%;box-sizing:border-box}
.finishwrap .gfoot{width:100%;max-width:460px;margin:0 auto;box-sizing:border-box}
.fnstamp{display:inline-block;background:var(--shu);color:#fff;font-family:"Fredoka","Noto Sans KR",sans-serif;
  font-size:26px;line-height:1;padding:16px 14px;border-radius:16px;box-shadow:0 5px 0 var(--shu-2);
  letter-spacing:.08em;writing-mode:horizontal-tb}
.fntitle{font-size:24px;margin:22px 0 0;letter-spacing:-.4px}
.fnsub{color:var(--ink-2);font-size:14px;line-height:1.7;margin:10px 0 0}
.fnstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:26px 0 0}
.fnstat{border:1.5px solid var(--line);border-radius:14px;padding:13px 10px;background:var(--paper-2)}
.fnstat .k{color:var(--ink-3);font-size:11.5px}
.fnstat .v{font-size:21px;font-weight:800;margin-top:4px;color:var(--ink)}
.fnnote{color:var(--ink-3);font-size:12.5px;line-height:1.7;margin:22px 0 0}
.bklink{background:none;border:none;color:var(--ink-3);font:inherit;font-size:12.5px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.gfoot{padding:14px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.unitband .s{font-size:12px;opacity:.75;margin-top:3px}

.lessons{position:relative;padding:16px 0 8px}
.lessons::before{
  content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;transform:translateX(-1px);
  background:repeating-linear-gradient(var(--stone) 0 5px,transparent 5px 11px);
}
.node-row{
  position:relative;z-index:1;display:grid;grid-template-columns:1fr 78px 1fr;
  align-items:center;padding:9px 0;
}
.lab{font-size:12px;color:var(--ink-3);line-height:1.35}
.lab.l{text-align:right;padding-right:16px}
.lab.r{text-align:left;padding-left:16px}
.nodecell{display:grid;place-items:center}
.node{
  position:relative;width:70px;height:70px;border:0;padding:0;border-radius:50%;
  background:var(--stone);color:var(--paper);display:grid;place-items:center;
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:26px;font-weight:700;
  box-shadow:0 5px 0 var(--drop), 0 0 0 8px var(--paper);
  transition:transform .12s ease, box-shadow .12s ease;
}
.node:not(:disabled):active{transform:translateY(4px) translateX(var(--off,0));box-shadow:0 1px 0 var(--drop), 0 0 0 8px var(--paper)}
.node{transform:translateX(var(--off,0))}
.node.open{background:var(--paper-2);color:var(--ai);box-shadow:0 5px 0 var(--ai-2), 0 0 0 8px var(--paper), inset 0 0 0 3px var(--ai)}
.node.done{background:var(--shu);color:var(--paper-2);box-shadow:0 5px 0 var(--shu-2), 0 0 0 8px var(--paper)}
.node.current{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(var(--off,0)) translateY(0)}50%{transform:translateX(var(--off,0)) translateY(-5px)}}
.node .stars{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;background:var(--paper);padding:3px 6px;border-radius:20px;border:1px solid var(--line);
}
.node .stars i{width:5px;height:5px;border-radius:50%;background:var(--stone);display:block}
.node .stars i.on{background:var(--gold)}
.node-row.locked{opacity:.5}
.node:disabled{cursor:default}

/* ---------------- lesson chrome ---------------- */
.lessonbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:12px 16px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);
}
.bar{flex:1;height:13px;border-radius:20px;background:var(--paper-3);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:20px;background:var(--shu);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.hearts{display:flex;gap:3px;align-items:center}
.hearts svg{width:20px;height:20px;display:block}
.hearts .h{color:var(--shu);transition:transform .2s,opacity .2s}
.hearts .h.off{color:var(--stone);opacity:.55;transform:scale(.82)}
.hearts .h.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.4)}100%{transform:scale(.82)}}

.stage{flex:1;padding:24px 20px 200px;display:flex;flex-direction:column}
.prompt-label{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);margin-bottom:18px}
.combo{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--shu);
  background:var(--shu-soft);padding:3px 9px;border-radius:20px;margin-left:9px;letter-spacing:.02em;
}
.combo svg{width:11px;height:11px}
.qjp{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:33px;font-weight:600;line-height:1.5;letter-spacing:.02em;text-wrap:balance}
.qkana{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:15px;color:var(--ink-3);margin-top:7px;letter-spacing:.1em}
.qko{font-size:24px;font-weight:700;line-height:1.5;text-wrap:balance;word-break:keep-all}
.qhint{font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.6}

.speaker{
  display:inline-flex;align-items:center;gap:9px;background:var(--ai);color:var(--on-accent);
  border:0;border-radius:14px;padding:13px 19px;font-weight:700;font-size:14px;
  box-shadow:0 4px 0 var(--ai-2);
}
.speaker:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ai-2)}
.speaker svg{width:21px;height:21px}
.speaker.big{padding:24px 30px;font-size:16px;border-radius:18px}
.speaker.big svg{width:32px;height:32px}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.opt{
  text-align:left;background:var(--paper-2);border:1.5px solid var(--line);border-bottom-width:4px;
  border-radius:14px;padding:15px 16px;font-size:16px;font-weight:500;
  transition:background .12s,border-color .12s,color .12s;
}
.opt.jp{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:20px;font-weight:600}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt.sel{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.opt.right{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}
.opt.wrong{background:var(--paper-3);border-color:var(--ink-3);color:var(--ink-3);text-decoration:line-through}

.answerline{
  margin-top:26px;min-height:60px;padding:9px 0;
  border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
}
.answerline.second{border-top:0;margin-top:0;min-height:52px}
.bank{margin-top:24px;display:flex;flex-wrap:wrap;gap:9px}
.tok{
  background:var(--paper-2);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:11px;
  padding:9px 13px;font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:19px;font-weight:600;
}
.tok:active{transform:translateY(2px);border-bottom-width:2px}
.tok.ghost{opacity:.25;pointer-events:none;border-style:dashed}

.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.mcard{
  background:var(--paper-2);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:13px;
  padding:15px 8px;min-height:66px;display:grid;place-items:center;text-align:center;
  font-size:15px;font-weight:600;line-height:1.35;word-break:keep-all;transition:opacity .2s,transform .2s,background .12s,border-color .12s,color .12s;
}
.mcard.jpc{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:20px}
.mcard.sel{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.mcard.gone{opacity:0;pointer-events:none;transform:scale(.88)}
.mcard.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.spellbox{
  width:100%;margin-top:26px;background:var(--paper-2);color:var(--ink);
  border:1.5px solid var(--line);border-bottom:2.5px solid var(--ai);border-radius:12px;
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:27px;font-weight:500;letter-spacing:.03em;
  padding:14px 16px;text-align:center;outline:none;
}
.spellbox::placeholder{color:var(--ink-3);font-size:19px;letter-spacing:0}
.spellbox:focus{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)}
.spellbox:disabled{opacity:1}

/* ---------------- footer + feedback ---------------- */
.footer{
  position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--paper);
  border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom));
}
.footer-inner{max-width:440px;margin:0 auto}
.cta{
  width:100%;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:900;letter-spacing:.02em;
  background:var(--ai);color:var(--on-accent);box-shadow:0 5px 0 var(--ai-2);
}
.cta.shu{background:var(--shu);box-shadow:0 5px 0 var(--shu-2)}
.cta.ghost{background:var(--paper-3);color:var(--ink-2);box-shadow:0 5px 0 var(--line)}
.cta:disabled{background:var(--paper-3);color:var(--ink-3);box-shadow:0 5px 0 var(--line);cursor:not-allowed}
.cta:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--drop)}

.feedback{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  transform:translateY(115%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding:18px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid transparent;
}
.feedback.show{transform:translateY(0)}
.feedback.ok{background:var(--shu-soft);border-color:var(--shu)}
.feedback.no{background:var(--ai-soft);border-color:var(--ai)}
.fb-inner{max-width:440px;margin:0 auto;display:flex;gap:14px;align-items:flex-start}
.fb-mark{flex:none;position:relative;width:58px}
.fb-badge{
  position:absolute;right:-8px;bottom:-4px;width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:14px;font-weight:700;
  color:var(--paper-2);box-shadow:0 0 0 3px var(--paper-2);
}
.feedback.ok .fb-badge{background:var(--shu);box-shadow:0 0 0 3px var(--shu-soft)}
.feedback.no .fb-badge{background:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)}
.fb-text{flex:1;min-width:0}
.fb-title{font-size:16px;font-weight:900;margin-bottom:4px;color:var(--ink)}
.fb-body{font-size:14px;color:var(--ink-2);line-height:1.55;word-break:keep-all}
.fb-body b{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:17px;color:var(--ink);font-weight:600}
.feedback .footer-inner{margin-top:14px}

/* ---------------- result ---------------- */
.center-screen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:36px 24px 44px;text-align:center}
.bigseal{
  width:112px;height:112px;border-radius:50%;display:grid;place-items:center;
  font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:46px;font-weight:700;
  border:5px solid var(--shu);color:var(--shu);margin-bottom:24px;
  animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes stamp{0%{transform:scale(2) rotate(-16deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.bigseal.fail{border-color:var(--ink-3);color:var(--ink-3)}
.center-screen h2{margin:0 0 8px;font-size:23px;font-weight:900}
.center-screen .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 26px;line-height:1.7;word-break:keep-all}
.scorecards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;margin-bottom:24px}
.scard{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper-2)}
.scard .h{font-size:10px;font-weight:900;letter-spacing:.1em;padding:6px 2px;color:var(--on-accent);background:var(--ai)}
.scard.gold .h{background:var(--gold)}
.scard.shu .h{background:var(--shu)}
.scard .v{padding:11px 4px;font-family:"Roboto Mono",monospace;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:700;padding:16px;text-decoration:underline}
.review{width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:22px;background:var(--paper-2)}
.review h3{margin:0 0 11px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.review ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.review li{display:flex;gap:11px;align-items:baseline;font-size:14px}
.review li .j{font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:17px;font-weight:600;flex:none}
.review li .k{color:var(--ink-3);font-size:13px}

/* ---------------- sheet ---------------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);
  border-radius:20px 20px 0 0;padding:24px 22px calc(20px + env(safe-area-inset-bottom));
  max-width:480px;margin:0 auto;transform:translateY(115%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
}
.sheet.show{transform:translateY(0)}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:900}
.sheet p{margin:0 0 20px;color:var(--ink-3);font-size:14px;line-height:1.65;word-break:keep-all}

/* ---------------- mascot, particles, flourishes ---------------- */
#petals,#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#petals{z-index:0}
#fxc{z-index:44}
#app{position:relative;z-index:1}

.neko{display:block;width:100%;height:auto;overflow:visible}
.neko-idle{animation:nekobob 3.4s ease-in-out infinite}
@keyframes nekobob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
.neko-happy{animation:nekojump .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes nekojump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-15px) scale(1.07)}60%{transform:translateY(0) scale(.97)}100%{transform:translateY(0) scale(1)}}
.neko-sad{animation:nekowob .6s ease-in-out}
@keyframes nekowob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.neko-cheer{animation:nekocheer 1.1s ease-in-out infinite}
@keyframes nekocheer{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}

.nekoblock{position:relative;margin:0 auto}
.nekoblock .stamp{
  position:absolute;right:-16px;bottom:10px;width:44px;height:44px;border-radius:12px;
  display:grid;place-items:center;font-family:"Fredoka","Noto Sans KR",sans-serif;font-size:22px;font-weight:700;
  background:var(--shu);color:var(--paper-2);box-shadow:0 4px 0 var(--shu-2);transform:rotate(-6deg);
  animation:stampin .5s cubic-bezier(.2,1.5,.4,1) both;
}
.nekoblock .stamp.grey{background:var(--stone);color:var(--paper);box-shadow:0 4px 0 var(--line)}
@keyframes stampin{0%{transform:scale(2.2) rotate(-20deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}

.xpfloat{
  position:fixed;z-index:56;font-family:"Roboto Mono",monospace;font-weight:700;font-size:21px;
  color:var(--gold);pointer-events:none;animation:xpup 1.05s ease-out forwards;
  text-shadow:0 2px 6px var(--paper),0 0 2px var(--paper);
}
@keyframes xpup{
  0%{opacity:0;transform:translate(-50%,0) scale(.6)}
  22%{opacity:1;transform:translate(-50%,-16px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-72px) scale(1)}
}
.sndrow{display:flex;gap:7px}
.iconbtn.muted{opacity:.42}
.bar>i{position:relative;overflow:hidden}
.bar>i::after{
  content:"";position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  animation:sheen 2.6s linear infinite;
}
.node.justdone{animation:justdone .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes justdone{0%{transform:translateX(var(--off,0)) scale(1.6) rotate(-14deg)}60%{transform:translateX(var(--off,0)) scale(.95)}100%{transform:translateX(var(--off,0)) scale(1)}}
@keyframes sheen{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}

:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  #petals{display:none}
  .bar>i::after{display:none}
}

.srscard{margin:4px 0 2px;padding:15px 16px;border-radius:16px;border:1.5px solid var(--line);
  background:var(--paper-2);display:flex;align-items:center;gap:12px}
.srscard.due{border-color:var(--shu);background:var(--shu-soft)}
.srscard .srsl{flex:1;min-width:0}
.srscard .st{font-weight:800;font-size:15px;color:var(--ink)}
.srscard .ss{color:var(--ink-2);font-size:12.5px;margin-top:3px;line-height:1.5}
.srsbtn{flex:none;border:none;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;
  font-size:14px;color:var(--on-accent);background:var(--shu);box-shadow:0 3px 0 var(--shu-2);cursor:pointer}
.srsbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shu-2)}
.trackhead .tt{color:var(--ink)}
.trackhead{margin:26px 0 10px;padding:0 2px}
.trackhead .thtop{display:flex;align-items:flex-start;gap:10px}
.trackhead .thl{flex:1;min-width:0}
.trackbtn{flex:none;margin-top:2px;border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink);

.trackbtn:active{transform:translateY(1px)}
.trackhead .tt{font-weight:800;font-size:18px;letter-spacing:-.2px}
.trackhead .ts{color:var(--ink-2);font-size:12.5px;margin-top:3px;line-height:1.45}
.trackhead .tp{color:var(--ink-3);font-size:11.5px;margin-top:6px;letter-spacing:.06em}
.path > .trackhead:first-child{margin-top:6px}
.qjp.solo{font-size:78px;line-height:1.15}

const LESSONS=[];
/* 균등 분할 — 마지막 레슨만 짧아지는 일이 없도록 */
function chunk(arr,k){ const out=[],n=arr.length; let i=0;
  for(let p=0;p<k;p++){ const len=Math.ceil((n-i)/(k-p)); out.push(arr.slice(i,i+len)); i+=len; }
  return out; }
UNITS.forEach((u,ui)=>{
  const c=chunk(u.w,3);
  u.lessons=[
    {title:'단어 ①', kanji:'1', w:c[0], s:[]},
    {title:'단어 ②', kanji:'2', w:c[1], s:[]},
    {title:'단어 ③', kanji:'3', w:c[2], s:[]},
    {title:'문장 만들기', kanji:'4', w:u.w, s:u.s},
    {title:'종합 복습', kanji:'★', w:u.w, s:u.s, review:true}
  ];
  u.lessons=u.lessons.map((l,i)=>{ l.id=u.id+'-'+(i+1); l.unit=ui; l.pos=i; l.track=u.track; LESSONS.push(l); return l; });
});

/* ---------------- 간격 반복 (라이트너 방식) ----------------
   맞히면 상자가 올라가고 다음 복습이 멀어집니다. 틀리면 1일 뒤로 되돌아갑니다.
   상자별 간격(일): 0일 → 1 → 3 → 7 → 21 → 60                          */
const KANA_W=UNITS.filter(u=>u.kana).flatMap(u=>u.w);
const VOCAB_W=UNITS.filter(u=>!u.kana).flatMap(u=>u.w);
const HIRA_W=KANA_W.filter(w=>/^[\u3041-\u309F]/.test(w.j));
const KATA_W=KANA_W.filter(w=>/^[\u30A0-\u30FF]/.test(w.j));
const KANA_SET=new Set(KANA_W.map(w=>w.j));
const isKana=it=>KANA_SET.has(it.j);
function poolFor(it){
  if(!isKana(it)) return VOCAB_W;
  return /^[\u30A0-\u30FF]/.test(it.j) ? KATA_W : HIRA_W;   // 문자 종류를 섞지 않습니다
}

const SRS_DAYS=[1,1,3,7,21,60];

function srsKey(it){ return it && it.j ? (it.t? 's:':'w:')+it.j : null; }
function srsTouch(it, ok){
  const k=srsKey(it); if(!k) return;
  const r=S.srs[k] || {b:0, d:0};
  r.b = ok ? Math.min(5, r.b+1) : 1;
  r.d = Date.now() + SRS_DAYS[r.b]*DAY;
  r.s = (r.s||0) + 1;
  S.srs[k]=r;
}
function srsLookup(k){
  const j=k.slice(2);
  return k[0]==='w' ? ALL_WORDS.find(w=>w.j===j) : ALL_SENT.find(x=>x.j===j);
}
function srsDue(){
  const now=Date.now(), out=[];
  for(const k in S.srs){ if(S.srs[k].d<=now){ const it=srsLookup(k); if(it) out.push(it); } }
  return out;
}
/* 다음 복습까지 남은 날 — 밀린 항목이 없을 때 안내용 */
function srsNextInDays(){
  const now=Date.now(); let best=Infinity;
  for(const k in S.srs){ const d=S.srs[k].d; if(d>now && d<best) best=d; }
  return best===Infinity ? null : Math.max(1, Math.ceil((best-now)/DAY));
}
function bumpStreak(){
  const t=dayKey(new Date());
  if(S.last===t) return;
  const ys=dayKey(new Date(Date.now()-864e5));
  S.streak=(S.last===ys)? S.streak+1 : 1;
  S.last=t;
}

const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 4 unique options; pools are tried in order so distractors stay near the lesson */
function opts4(correct, pools, keyfn){
  const seen=new Set([correct]); const out=[correct];
  for(const pool of pools){
    for(const c of shuffle(pool)){
      const v=keyfn(c);
      if(seen.has(v)) continue;
      seen.add(v); out.push(v);
      if(out.length===4) break;
    }
    if(out.length===4) break;
  }
  return shuffle(out);
}

}
function nekoBlock(mood, stampChar, size, grey){

}

/* ---------------- sound: synthesised, no files ---------------- */
const SND={ctx:null, master:null, sfxBus:null, musBus:null, timer:null, step:0, next:0};
function ac(){
  if(!SND.ctx){
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    try{ SND.ctx=new C(); }catch(e){ return null; }
    SND.master=SND.ctx.createGain(); SND.master.gain.value=.9; SND.master.connect(SND.ctx.destination);
    SND.sfxBus=SND.ctx.createGain(); SND.sfxBus.gain.value=.5; SND.sfxBus.connect(SND.master);
    SND.musBus=SND.ctx.createGain(); SND.musBus.gain.value=0; SND.musBus.connect(SND.master);
  }
  if(SND.ctx.state==='suspended') SND.ctx.resume().catch(()=>{});
  return SND.ctx;
}
function pluck(freq, at, dur, gain, type, bus){
  const c=SND.ctx; if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(gain, at+.014);
  g.gain.exponentialRampToValueAtTime(.0001, at+dur);
  o.connect(g); g.connect(bus||SND.sfxBus);
  o.start(at); o.stop(at+dur+.06);
}
function noise(at, dur, gain){
  const c=SND.ctx; if(!c) return;
  const n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1600;
  const g=c.createGain(); g.gain.value=gain;
  s.connect(f); f.connect(g); g.connect(SND.sfxBus); s.start(at);
}
const YO=[261.63,293.66,349.23,392.00,440.00,523.25,587.33,698.46];  // 요나누키 음계
function sfx(name){
  if(!S.sfxOn) return;
  const c=ac(); if(!c) return;
  const t=c.currentTime;
  if(name==='correct'){
    pluck(YO[3],t,.5,.3);pluck(YO[5],t+.07,.55,.26);pluck(YO[7],t+.14,.7,.2,'sine');
  } else if(name==='combo'){
    pluck(YO[3],t,.4,.26);pluck(YO[5],t+.06,.4,.24);pluck(YO[7],t+.12,.5,.22);
    pluck(YO[7]*1.5,t+.2,.8,.16,'sine');pluck(YO[7]*2,t+.28,.9,.1,'sine');
  } else if(name==='wrong'){
    pluck(196,t,.32,.22,'sine');pluck(146.83,t+.1,.5,.2,'sine');noise(t,.08,.05);
  } else if(name==='heart'){
    pluck(330,t,.16,.18,'sine');pluck(220,t+.08,.3,.16,'sine');
  } else if(name==='tap'){
    pluck(880,t,.05,.07,'sine');
  } else if(name==='pair'){
    pluck(YO[5],t,.28,.2);pluck(YO[7],t+.05,.34,.16,'sine');
  } else if(name==='complete'){
    [0,3,5,7].forEach((n,i)=>pluck(YO[n],t+i*.13,.9,.28));
    pluck(YO[7]*2,t+.55,1.6,.14,'sine');
    for(let i=0;i<7;i++) pluck(YO[3+(i%5)]*2,t+.62+i*.055,.5,.07,'sine');
  } else if(name==='fail'){
    [7,5,3,0].forEach((n,i)=>pluck(YO[n]/2,t+i*.16,.7,.2,'sine'));
  }
}
/* looping koto-ish background phrase */
const MEL=[0,2,4,2, 5,4,2,0, 1,3,5,3, 4,2,0,2];
function musicTick(){
  const c=SND.ctx; if(!c||!S.bgmOn) return;
  const now=c.currentTime;
  if(SND.next<now) SND.next=now+.06;
  while(SND.next<now+.5){
    const s=SND.step%16, at=SND.next;
    if(s%8===0) pluck(130.81,at,2.6,.2,'sine',SND.musBus);
    if(s%8===4) pluck(196,at,2.2,.16,'sine',SND.musBus);
    if(Math.random()>.16) pluck(YO[MEL[s]],at,1.2,.1,'triangle',SND.musBus);
    if(s%4===2) pluck(YO[MEL[s]]*2,at+.1,.7,.04,'sine',SND.musBus);
    SND.next+=.44; SND.step++;
  }
}
function setMusic(on){
  S.bgmOn=on; save();
  const c=ac(); if(!c) return;
  SND.musBus.gain.cancelScheduledValues(c.currentTime);
  SND.musBus.gain.linearRampToValueAtTime(on?.5:0, c.currentTime+(on?1.2:.5));
  if(on && !SND.timer){ SND.next=c.currentTime+.1; SND.timer=setInterval(musicTick,120); }
  if(!on && SND.timer){ clearInterval(SND.timer); SND.timer=null; }
}

const PET={c:null,x:null,p:[],raf:0,w:0,h:0};
function fitCanvas(cv){

  cv.width=Math.floor(innerWidth*d); cv.height=Math.floor(innerHeight*d);
  const cx=cv.getContext('2d'); cx.setTransform(d,0,0,d,0,0);
  return cx;
}
function initCanvases(){

}
/* 바다 거품처럼 위로 떠오르는 방울 */
function petal(x,y){
  return {x, y, r:3+Math.random()*6, vy:-(.22+Math.random()*.4), vx:-.18+Math.random()*.36,
          a:Math.random()*6.28, va:(-.5+Math.random())*.02, sw:1, o:.14+Math.random()*.2};
}
function drawPetal(x,p){
  x.save(); x.translate(p.x,p.y);
  x.globalAlpha=p.o;
  x.beginPath(); x.arc(0,0,p.r,0,6.2832);
  x.fillStyle='#7FC3DC'; x.fill();
  x.lineWidth=1; x.strokeStyle='#4FA8C8'; x.globalAlpha=p.o*.8; x.stroke();
  x.globalAlpha=p.o*.9; x.fillStyle='#FFFFFF';
  x.beginPath(); x.arc(-p.r*.32,-p.r*.32,Math.max(1,p.r*.22),0,6.2832); x.fill();
  x.restore();
}
function petalsOn(){
  if(RM || !PET.x) return;
  if(!PET.p.length) for(let i=0;i<12;i++) PET.p.push(petal(Math.random()*PET.w, Math.random()*PET.h));
  if(PET.raf) return;
  const loop=()=>{
    const x=PET.x; x.clearRect(0,0,PET.w,PET.h);
    PET.p.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx+Math.sin(p.y/60)*.3; p.a+=p.va;
      if(p.y<-18){ p.y=PET.h+18; p.x=Math.random()*PET.w; }
      if(p.x<-20) p.x=PET.w+18; if(p.x>PET.w+20) p.x=-18;
      drawPetal(x,p);
    });
    PET.raf=requestAnimationFrame(loop);
  };
  loop();
}
function petalsOff(){
  if(PET.raf) cancelAnimationFrame(PET.raf);
  PET.raf=0;
  if(PET.x) PET.x.clearRect(0,0,innerWidth,innerHeight);
}
const CONF=['#D2452E','#23406E','#E0B34A','#F0A9B4','#4E9A72'];
function burst(cx,cy,n,power){
  if(RM || !FX.x) return;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2 + (Math.random()-.5)*2.2, sp=(2.5+Math.random()*5)*(power||1);
    FX.p.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      w:4+Math.random()*7,h:3+Math.random()*6,c:CONF[(Math.random()*CONF.length)|0],
      a:Math.random()*6.28,va:(-.5+Math.random())*.35,life:1,round:Math.random()<.3});
  }
  fxLoop();
}
function fxLoop(){
  if(FX.raf) return;
  const step=()=>{
    const x=FX.x; x.clearRect(0,0,innerWidth,innerHeight);
    FX.p=FX.p.filter(p=>p.life>0);
    FX.p.forEach(p=>{
      p.vy+=.22; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life-=.011;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a);
      x.globalAlpha=Math.max(0,Math.min(1,p.life*1.6)); x.fillStyle=p.c;
      if(p.round){ x.beginPath(); x.arc(0,0,p.w/2,0,6.283); x.fill(); }
      else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      x.restore();
    });
    if(FX.p.length) FX.raf=requestAnimationFrame(step);
    else { FX.raf=0; x.clearRect(0,0,innerWidth,innerHeight); }
  };
  FX.raf=requestAnimationFrame(step);
}
function xpPop(amount){
  if(RM||!amount) return;
  const d=document.createElement('div');
  d.className='xpfloat'; d.textContent='+'+amount+' XP';
  d.style.left=(innerWidth/2)+'px'; d.style.top=(innerHeight*.56)+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1100);
}

/* ---------------- speech ---------------- */
const TTS = ('speechSynthesis' in window);
let EN_VOICE=null, VOICES_SEEN=false;
function loadVoices(){
  if(!TTS) return;
  const vs=speechSynthesis.getVoices()||[];
  if(!vs.length) return;
  VOICES_SEEN=true;
  const en=vs.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0);
  /* 미국 영어를 먼저 찾고, 없으면 아무 영어 목소리나 씁니다 */
  EN_VOICE = en.find(v=>/en[-_]us/i.test(v.lang)) || en[0] || null;
}
if(TTS){ loadVoices(); speechSynthesis.addEventListener('voiceschanged', loadVoices); }
function speak(text){
  if(!TTS||!text) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.85; u.pitch=1;
    if(EN_VOICE) u.voice=EN_VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 듣기 문제는 영어 목소리가 있을 때만 (iOS는 목록이 늦게 채워집니다) */
function audioOK(){ return TTS && (EN_VOICE || !VOICES_SEEN); }

/* 철자 문제로 낼 만한 단어: 한 낱말, 너무 길지 않은 것 */
const SPELLABLE=/^[A-Za-z][A-Za-z'-]{1,9}$/;

function mcqMeaning(it,W){ return {kind:'mcq', q:'뜻을 고르세요', jp:it.j, kana:it.k, audio:it.j,
  options:opts4(it.m, [W, ALL_WORDS], x=>x.m), answer:it.m, item:it}; }
function mcqWord(it,W){ return {kind:'mcq', q:'영어를 고르세요', ko:it.m, jpOpts:true,
  options:opts4(it.j, [W, ALL_WORDS], x=>x.j), answer:it.j, item:it}; }
function listenEx(it,W){ return {kind:'listen', q:'들리는 것을 고르세요', audio:it.j, jpOpts:true,
  options:opts4(it.j, [W, ALL_WORDS], x=>x.j), answer:it.j, item:it}; }
function typeEx(it){ return {kind:'type', q:'철자를 입력하세요', ko:it.m, hint:it.k, audio:it.j, answer:it.j, item:it}; }
function assembleEx(st){ return {kind:'assemble', q:'단어를 배열해 문장을 만드세요', ko:st.m, audio:st.j,
  tokens:scramble(st.t), answer:st.t.join(' '), item:st}; }
function sentMcq(st,SS){ return {kind:'mcq', q:'뜻을 고르세요', jp:st.j, kana:st.k, audio:st.j,
  options:opts4(st.m, [SS, ALL_SENT], x=>x.m), answer:st.m, item:st}; }
function scramble(t){
  if(t.length<2) return t.slice();
  let o=shuffle(t), g=0;
  while(o.join('|')===t.join('|') && g++<60) o=shuffle(t);
  return o;
}

function makeExercises(lesson){
  const ws=lesson.w, ss=lesson.s, ex=[];
  const W = UNITS[lesson.unit] ? UNITS[lesson.unit].w : ALL_WORDS;   // same-unit distractors
  const SS = UNITS[lesson.unit] ? UNITS[lesson.unit].s : ALL_SENT;
  const typable=ws.filter(w=>SPELLABLE.test(w.j));

  if(ss.length){
    shuffle(ss).forEach((st,i)=>{
      ex.push(assembleEx(st));
      if(i%2===0) ex.push(sentMcq(st,SS));
    });
    pick(typable, Math.min(2,typable.length)).forEach(w=>ex.push(typeEx(w)));
    if(audioOK()) pick(ws,2).forEach(w=>ex.push(listenEx(w,W)));
    if(lesson.review && ws.length>=5) ex.push({kind:'match', q:'짝을 맞추세요', pairs:pick(ws,5)});
  } else {
    shuffle(ws).forEach((it,i)=>{ ex.push(i%2 ? mcqWord(it,W) : mcqMeaning(it,W)); });
    if(ws.length>=5) ex.push({kind:'match', q:'짝을 맞추세요', pairs:pick(ws,5)});
    if(audioOK()) pick(ws,2).forEach(it=>ex.push(listenEx(it,W)));
    pick(typable, Math.min(3,typable.length)).forEach(it=>ex.push(typeEx(it)));
  }

  const match=ex.filter(e=>e.kind==='match');
  const rest=shuffle(ex.filter(e=>e.kind!=='match'));
  const cap=lesson.review?13:10;
  const out=rest.slice(0,cap-match.length);
  if(match.length) out.splice(Math.min(3,out.length),0,...match);
  return out;
}

/* ===== 진도 병합 =====
   두 기기에서 각각 학습한 결과를 합칩니다. 덮어쓰기가 아니라 합치기입니다.
   원칙: 어느 쪽에서든 한 번 이룬 진전은 사라지지 않는다. */

function dayNum(k){                       // 'YYYY-M-D' → 비교 가능한 숫자
  if(!k || typeof k!=='string') return -1;
  const p=k.split('-').map(Number);
  if(p.length!==3 || p.some(isNaN)) return -1;
  return p[0]*10000 + p[1]*100 + p[2];
}

function mergeProgress(a, b){
  if(!a) return b ? JSON.parse(JSON.stringify(b)) : null;
  if(!b) return JSON.parse(JSON.stringify(a));
  const out = {};

  // XP: 누적값이라 더하면 이중 계산이 됩니다. 더 많이 쌓인 쪽을 씁니다.
  out.xp = Math.max(a.xp|0, b.xp|0);

  // 레슨: 같은 레슨이면 별점이 높은 쪽
  out.done = Object.assign({}, a.done||{});
  const bd = b.done||{};
  for(const k in bd) out.done[k] = Math.max(out.done[k]|0, bd[k]|0);

  // 복습 일정: 항목별로 더 많이 익힌 쪽(상자가 높은 쪽).
  // 상자가 같으면 다음 복습이 더 뒤인 쪽 = 더 최근에 푼 쪽.
  out.srs = {};
  const as=a.srs||{}, bs=b.srs||{};
  for(const k of new Set([...Object.keys(as), ...Object.keys(bs)])){
    const x=as[k], y=bs[k];
    if(!x){ out.srs[k]=y; continue; }
    if(!y){ out.srs[k]=x; continue; }
    if((y.b|0) > (x.b|0)) out.srs[k]=y;
    else if((y.b|0) < (x.b|0)) out.srs[k]=x;
    else out.srs[k] = ((y.d|0) > (x.d|0)) ? y : x;
  }

  // 오답 노트: 합집합. 한쪽에서 틀렸으면 여전히 복습 대상입니다.
  out.mistakes = [...new Set([...(a.mistakes||[]), ...(b.mistakes||[])])];

  // 이미 본 문법 카드: 합집합
  out.seenG = Object.assign({}, a.seenG||{}, b.seenG||{});

  // 연속 학습일: 마지막 학습일이 더 뒤인 쪽의 기록을 따릅니다.
  // 같은 날이면 더 긴 쪽.
  const da=dayNum(a.last), db=dayNum(b.last);
  if(db > da){ out.last=b.last; out.streak=b.streak|0; }
  else if(da > db){ out.last=a.last; out.streak=a.streak|0; }
  else { out.last=a.last||b.last||null; out.streak=Math.max(a.streak|0, b.streak|0); }

  return out;
}

  async init(){

      this.ready=false; this.set('off');       // 통신 불가 — 로컬 전용으로 계속

  async pull(){

/* 서버에 올리고 내리는 것은 진도뿐입니다 — 테마·소리 설정은 기기별로 둡니다. */
function snapshotOf(s){
  return { xp:s.xp|0, streak:s.streak|0, last:s.last||null,
           done:s.done||{}, mistakes:s.mistakes||[], srs:s.srs||{}, seenG:s.seenG||{} };
}
function applyProgress(p){
  S.xp=p.xp|0; S.streak=p.streak|0; S.last=p.last||null;
  S.done=p.done||{}; S.mistakes=p.mistakes||[]; S.srs=p.srs||{}; S.seenG=p.seenG||{};
  save();
}

/* ---------------- 진행 상황 백업 ----------------
   기기 간 자동 동기화는 이 환경에서 제공되지 않습니다.
   대신 진도 전체를 한 덩어리 코드로 뽑아 두었다가 다른 기기에서 되돌릴 수 있게 합니다. */
const BK_TAG='ENGLISHCAMP';
function b64enc(bytes){
  let s='';
  for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(str){
  const b=atob(str.replace(/-/g,'+').replace(/_/g,'/'));
  const out=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) out[i]=b.charCodeAt(i);
  return out;
}
async function makeBackup(){
  const payload={v:1, xp:S.xp, streak:S.streak, last:S.last, done:S.done,
                 mistakes:S.mistakes, srs:S.srs, seenG:S.seenG};
  const bytes=new TextEncoder().encode(JSON.stringify(payload));
  if(typeof CompressionStream==='function'){
    try{
      const buf=await new Response(new Blob([bytes]).stream()
        .pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      return BK_TAG+'Z'+b64enc(new Uint8Array(buf));
    }catch(e){}
  }
  return BK_TAG+'P'+b64enc(bytes);
}
async function readBackup(code){
  const t=String(code).trim().replace(/\s+/g,'');
  if(t.indexOf(BK_TAG)!==0) throw new Error('형식이 맞지 않습니다');
  const mode=t[BK_TAG.length], body=t.slice(BK_TAG.length+1);
  if(!body) throw new Error('내용이 비어 있습니다');
  let bytes;
  try{ bytes=b64dec(body); }catch(e){ throw new Error('코드가 손상되었습니다'); }
  if(mode==='Z'){
    if(typeof DecompressionStream!=='function') throw new Error('이 브라우저에서는 이 코드를 풀 수 없습니다');
    try{
      const buf=await new Response(new Blob([bytes]).stream()
        .pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      bytes=new Uint8Array(buf);
    }catch(e){ throw new Error('코드가 손상되었습니다 — 일부만 복사되지 않았는지 확인해 주세요'); }
  } else if(mode!=='P') throw new Error('알 수 없는 형식입니다');
  let o;
  try{ o=JSON.parse(new TextDecoder().decode(bytes)); }
  catch(e){ throw new Error('코드가 손상되었습니다'); }
  if(!o || typeof o!=='object' || !o.done || typeof o.done!=='object') throw new Error('진행 정보를 찾을 수 없습니다');
  return o;
}
function backupStats(o){
  const lessons=Object.keys(o.done||{}).length;
  const items=Object.keys(o.srs||{}).length;
  return lessons+'개 레슨 · 복습 항목 '+items+'개 · XP '+(o.xp||0);
}

  app.innerHTML=`

  $('#bkBack').onclick=()=>{ sfx('tap'); renderHome(); };

          save(); sfx('complete'); renderHome();

function startLesson(lesson, skipGrammar){
  if(!lesson) return renderHome();
  const u=UNITS[lesson.unit];
  if(!skipGrammar && lesson.pos===0 && u && u.grammar && !S.seenG[u.id]){
    S.seenG[u.id]=1; save();
    return showGrammar(u, ()=>startLesson(lesson, true));
  }
  const ex=makeExercises(lesson);
  if(!ex.length) return renderHome();
  G=newGame(lesson, ex);
  renderExercise();
}
function startSrs(){
  const due=srsDue();
  if(!due.length) return renderHome();
  const items=pick(due, Math.min(12, due.length));
  const ex=[];
  items.forEach((it,i)=>{
    if(it.t){ ex.push(i%2 ? assembleEx(it) : sentMcq(it, ALL_SENT)); return; }
    const P=poolFor(it), kn=isKana(it);
    ex.push(i%2 ? mcqWord(it,P,kn) : mcqMeaning(it,P,kn));
  });
  G=newGame({id:'__srs', title:'오늘의 복습', isReview:true}, shuffle(ex));
  renderExercise();
}
function startReview(){
  const items=S.mistakes.map(j=>ALL_WORDS.find(w=>w.j===j)).filter(Boolean);
  if(!items.length){ S.mistakes=[]; save(); return renderHome(); }
  const ex=pick(items,10).map((it,i)=>{ const P=poolFor(it), kn=isKana(it);
    return i%2? mcqWord(it,P,kn) : mcqMeaning(it,P,kn); });
  G=newGame({id:'__review', title:'틀린 표현 복습', isReview:true}, ex);
  renderExercise();
}

function heartsHTML(){
  let h='';
  for(let i=0;i<5;i++) h+=`<span class="h ${i<G.hearts?'':'off'}">${ICON.heart}</span>`;
  return h;
}
function shell(inner, footer){
  const pct=Math.round(G.cleared/G.total*100);

    <button class="iconbtn" id="quitBtn" aria-label="레슨 나가기">${ICON.x}</button>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="hearts" aria-label="남은 하트 ${G.hearts}개">${heartsHTML()}</div>
  </div>
  <div class="stage">${inner}</div>
  <div class="footer" id="mainFooter"><div class="footer-inner">${footer}</div></div>
  <div class="feedback" id="fb">
    <div class="fb-inner">
      <div class="fb-mark jp" id="fbMark"></div>
      <div class="fb-text"><div class="fb-title" id="fbTitle"></div><div class="fb-body" id="fbBody"></div></div>
    </div>
    <div class="footer-inner"><button class="cta" id="fbBtn">계속하기</button></div>
  </div>`;
}

function renderExercise(){
  const e=G.queue[G.i];
  G.answered=false; G.sel=null; G.built=[]; G.typed=''; G.ms=null;
  const combo = G.combo>=3 ? `<span class="combo">${ICON.bolt}${G.combo} 콤보</span>` : '';
  const say = txt => audioOK()? `<button class="speaker" data-say="${esc(txt)}">${ICON.sound} 듣기</button>` : '';
  let body='', footer='';

  if(e.kind==='mcq'){
    const head = e.jp
      ? `<div class="qjp jp${e.jp && [...e.jp].length<=2 ? ' solo':''}">${esc(e.jp)}</div>${e.kana&&e.kana!==e.jp?`<div class="qkana jp">${esc(e.kana)}</div>`:''}
         ${e.audio?`<div style="margin-top:16px">${say(e.audio)}</div>`:''}`
      : `<div class="qko">${esc(e.ko)}</div>`;
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>${head}
      <div class="opts">${e.options.map(o=>`<button class="opt ${e.jpOpts?'jp':''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    footer=`<button class="cta" id="check" disabled>확인</button>`;
  }
  else if(e.kind==='listen'){
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>
      <div style="margin:6px 0 2px"><button class="speaker big" data-say="${esc(e.audio)}">${ICON.sound} 다시 듣기</button></div>
      <div class="qhint">소리를 듣고 알맞은 것을 고르세요.</div>
      <div class="opts">${e.options.map(o=>`<button class="opt jp" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    footer=`<button class="cta" id="check" disabled>확인</button>`;
  }
  else if(e.kind==='assemble'){
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>
      <div class="qko">${esc(e.ko)}</div>
      ${e.audio&&audioOK()?`<div style="margin-top:16px">${say(e.audio)}</div>`:''}
      <div class="answerline" id="ansLine"></div>
      <div class="answerline second"></div>
      <div class="bank" id="bank">${e.tokens.map((t,i)=>`<button class="tok jp" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
    footer=`<button class="cta" id="check" disabled>확인</button>`;
  }
  else if(e.kind==='match'){
    const L=shuffle(e.pairs), R=shuffle(e.pairs);
    G.ms={sel:null, miss:0, left:e.pairs.length};
    let cells='';
    for(let i=0;i<L.length;i++){
      cells+=`<button class="mcard jpc jp" data-k="${esc(L[i].j)}" data-side="l">${esc(L[i].j)}</button>`;
      cells+=`<button class="mcard" data-k="${esc(R[i].j)}" data-side="r">${esc(R[i].m)}</button>`;
    }
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>
      <div class="qhint" style="margin-top:0">영어와 뜻을 하나씩 눌러 연결하세요.</div>
      <div class="matchgrid">${cells}</div>`;
    footer=`<button class="cta" disabled>남은 짝 <span id="remain" class="mono">${e.pairs.length}</span></button>`;
  }
  else if(e.kind==='type'){
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>
      <div class="qko">${esc(e.ko)}</div>
      ${e.hint?`<div class="qkana">${esc(e.hint)}</div>`:''}
      ${audioOK()?`<div style="margin-top:14px">${say(e.audio)}</div>`:''}
      <input class="spellbox jp" id="spell" type="text" inputmode="latin" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type here">`;
    footer=`<button class="cta" id="check" disabled>확인</button>`;
  }

  app.innerHTML=shell(body, footer);
  petalsOff();
  $('#quitBtn').onclick=confirmQuit;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  $('#fbBtn').onclick=next;

  if(e.kind==='mcq'||e.kind==='listen') bindOptions(e);
  else if(e.kind==='assemble') bindAssemble(e);
  else if(e.kind==='match') bindMatch(e);
  else if(e.kind==='type') bindType(e);
  if(e.kind==='listen') setTimeout(()=>speak(e.audio), 380);
  window.scrollTo(0,0);
}

function confirmQuit(){
  openSheet('레슨을 그만둘까요?','지금 나가면 이번 레슨의 진행 상황은 저장되지 않아요.',
    '계속 학습하기', closeSheet, '나가기', ()=>{ closeSheet(); renderHome(); });
}
function bindOptions(e){
  const chk=$('#check');
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(G.answered) return;
    app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); G.sel=b.dataset.v; chk.disabled=false;
  });
  chk.onclick=()=>judge(G.sel===e.answer, e.answer);
}
function bindAssemble(e){
  const line=$('#ansLine'), bank=$('#bank'), chk=$('#check');
  function paint(){
    line.innerHTML=G.built.map((b,i)=>`<button class="tok jp" data-back="${i}">${esc(b.t)}</button>`).join('');
    bank.querySelectorAll('.tok').forEach(t=>t.classList.toggle('ghost', G.built.some(b=>b.i===+t.dataset.i)));
    line.querySelectorAll('[data-back]').forEach(t=>t.onclick=()=>{
      if(G.answered) return;
      G.built.splice(+t.dataset.back,1); paint();
    });
    chk.disabled = G.built.length!==e.tokens.length;
  }
  bank.querySelectorAll('.tok').forEach(t=>t.onclick=()=>{
    if(G.answered||t.classList.contains('ghost')) return;
    G.built.push({i:+t.dataset.i, t:e.tokens[+t.dataset.i]}); paint();
  });
  paint();
  chk.onclick=()=>judge(G.built.map(b=>b.t).join(' ')===e.answer, e.answer);
}
function bindMatch(e){
  const ms=G.ms;
  app.querySelectorAll('.mcard').forEach(c=>c.onclick=()=>{
    if(G.answered||c.classList.contains('gone')) return;
    if(!ms.sel){ ms.sel=c; c.classList.add('sel'); return; }
    if(ms.sel===c){ c.classList.remove('sel'); ms.sel=null; return; }
    if(ms.sel.dataset.side===c.dataset.side){ ms.sel.classList.remove('sel'); ms.sel=c; c.classList.add('sel'); return; }
    if(ms.sel.dataset.k===c.dataset.k){
      const w=e.pairs.find(p=>p.j===c.dataset.k); if(w) speak(w.k);
      sfx('pair');
      const r=c.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 10, .6);
      const a=ms.sel; a.classList.remove('sel');
      a.classList.add('gone'); c.classList.add('gone'); ms.sel=null;
      ms.left--; $('#remain').textContent=ms.left;
      if(ms.left===0) setTimeout(()=>judge(ms.miss===0, null, ms.miss), 260);
    } else {
      ms.miss++; sfx('wrong');
      const a=ms.sel, b=c;
      a.classList.add('bad'); b.classList.add('bad');
      setTimeout(()=>{ a.classList.remove('bad','sel'); b.classList.remove('bad'); }, 420);
      ms.sel=null;
    }
  });
}

/* 철자 비교 — 대소문자와 앞뒤 공백은 무시합니다 */
const normSpell = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function bindType(e){
  const inp=$('#spell'), chk=$('#check');
  const paint=()=>{ G.typed=inp.value; chk.disabled=!inp.value.trim().length; };
  inp.addEventListener('input', paint);
  inp.addEventListener('keydown', ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); if(!chk.disabled && !G.answered) chk.click(); }
  });
  paint();
  setTimeout(()=>{ try{ inp.focus(); }catch(_){} }, 60);
  chk.onclick=()=>{
    inp.blur(); inp.disabled=true;
    judge(normSpell(G.typed)===normSpell(e.answer), e.answer);
  };
}

/* ---------------- 7. JUDGE + FEEDBACK ---------------- */
function judge(ok, correct, missCount){
  if(G.answered) return;
  G.answered=true;
  const e=G.queue[G.i];

  if(e.kind==='mcq'||e.kind==='listen'){
    app.querySelectorAll('.opt').forEach(b=>{
      if(b.dataset.v===e.answer) b.classList.add('right');
      else if(b.classList.contains('sel')) b.classList.add('wrong');
      b.classList.remove('sel');
    });
  }

  let gain=0;
  if(ok){
    G.cleared++; G.combo++; G.best=Math.max(G.best,G.combo);
    gain = 10 + (G.combo>=5?5:0) + (e.kind==='assemble'||e.kind==='type'?5:0);
    G.xp+=gain;
    sfx(G.combo>=5?'combo':'correct');
    burst(innerWidth/2, innerHeight-130, G.combo>=5?46:28, G.combo>=5?1.25:1);
    xpPop(gain);
    if(e.audio) speak(e.audio); else if(e.item&&e.item.k) speak(e.item.k);
    if(!FREE_MODE){                       // 자유 복습은 일정을 앞당기지 않습니다
      if(e.item) srsTouch(e.item, true);
      if(e.kind==='match' && e.pairs) e.pairs.forEach(p=>srsTouch(p, true));
      if(e.item || e.pairs) save();
    }
  } else {
    G.combo=0;
    sfx('wrong'); setTimeout(()=>sfx('heart'),160);
    G.hearts=Math.max(0,G.hearts-1);
    if(e.item){
      G.wrong.push(e.item);
      srsTouch(e.item, false);
      if(e.item.j && ALL_WORDS.some(w=>w.j===e.item.j) && S.mistakes.indexOf(e.item.j)<0){ S.mistakes.push(e.item.j); }
      save();
    }
    if(e.kind==='match' && e.pairs){
      e.pairs.forEach(p=>{ srsTouch(p,false); if(S.mistakes.indexOf(p.j)<0) S.mistakes.push(p.j); });
      save();
    }
    G.queue.push(e); G.total++;
    const hs=app.querySelectorAll('.hearts .h');
    if(hs[G.hearts]) hs[G.hearts].classList.add('off','pop');
  }

  const bar=app.querySelector('.bar>i'); if(bar) bar.style.width=Math.round(G.cleared/G.total*100)+'%';

  const dead = G.hearts<=0;
  const fb=$('#fb'), btn=$('#fbBtn');
  $('#fbMark').innerHTML = `<div class="neko-${ok?'happy':'sad'}">${nekoHead(ok?'happy':'sad')}</div>
    <span class="fb-badge jp">${ok?'〇':'✕'}</span>`;
  fb.classList.add(ok?'ok':'no','show');
  const praise=['정답!','좋아요!','すごい！','완벽해요!','바로 그거예요!'];
  if(ok){
    $('#fbTitle').textContent = praise[Math.floor(Math.random()*praise.length)];
    $('#fbBody').innerHTML = (e.item && e.item.m)
      ? `<b>${esc(e.item.j)}</b>　${e.item.k&&e.item.k!==e.item.j?esc(e.item.k)+' · ':''}${esc(e.item.m)}`
      : '다섯 짝을 한 번에 모두 맞혔어요.';
    btn.className='cta shu';
  } else {
    $('#fbTitle').textContent='아쉬워요';
    $('#fbBody').innerHTML = e.kind==='match'
      ? `연결을 ${missCount}번 틀렸어요. 이 문제는 뒤에서 한 번 더 나옵니다.`
      : `정답: <b>${esc(correct||e.answer)}</b>${(e.item&&e.item.m&&e.item.m!==(correct||e.answer))?`　${esc(e.item.m)}`:''}`;
    btn.className='cta';
  }
  if(dead){ btn.textContent='결과 보기'; btn.onclick=renderFail; }
  else btn.textContent='계속하기';
  $('#mainFooter').style.visibility='hidden';
}
function next(){
  G.i++;
  if(G.i>=G.queue.length) renderResult();
  else renderExercise();
}

/* ---------------- 8. RESULT ---------------- */
function uniqWrong(){ return [...new Map(G.wrong.map(w=>[w.j,w])).values()].slice(0,5); }

function renderResult(){
  const acc=Math.round(G.cleared/G.total*100);
  const stars = G.hearts>=5?3 : G.hearts>=3?2 : 1;
  const bonus = G.hearts===5?15:0;
  const totalXP=G.xp+bonus;

  S.xp+=totalXP;
  if(!G.lesson.isReview) S.done[G.lesson.id]=Math.max(S.done[G.lesson.id]||0, stars);
  else if(G.lesson.id==='__review'){
    const stillWrong=new Set(G.wrong.map(w=>w.j));
    const asked=new Set(G.queue.map(q=>q.item&&q.item.j).filter(Boolean));
    S.mistakes=S.mistakes.filter(j=>!asked.has(j)||stillWrong.has(j));
  }
  if(!S.firstDay) S.firstDay=dayKey(new Date());
  bumpStreak(); save(); CLOUD.queue();
  const fin = G.lesson.isReview ? null : newlyFinished();
  if(!G.lesson.isReview) JUST_DONE=G.lesson.id;
  sfx('complete');
  setTimeout(()=>{ burst(innerWidth*.25, innerHeight*.45, 40, 1.3); }, 120);
  setTimeout(()=>{ burst(innerWidth*.75, innerHeight*.45, 40, 1.3); }, 330);
  setTimeout(()=>{ burst(innerWidth*.5, innerHeight*.35, 50, 1.5); }, 560);

  const wl=uniqWrong();
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock('cheer','合',146)}
    <h2>레슨 완료!</h2>
    <p class="sub">${esc(G.lesson.title)} · ${bonus?'하트를 하나도 잃지 않았어요. 보너스 +15 XP':'꾸준함이 실력이 됩니다'}</p>
    <div class="scorecards">
      <div class="scard gold"><div class="h">획득 XP</div><div class="v">+${totalXP}</div></div>
      <div class="scard shu"><div class="h">정확도</div><div class="v">${acc}%</div></div>
      <div class="scard"><div class="h">최고 콤보</div><div class="v">${G.best}</div></div>
    </div>
    ${wl.length?`<div class="review"><h3>다시 볼 표현</h3><ul>${wl.map(w=>
      `<li><span class="j">${esc(w.j)}</span><span class="k">${esc(w.m)}</span></li>`).join('')}</ul></div>`:''}
    <div style="width:100%"><button class="cta shu" id="homeBtn">계속하기</button></div>
    <button class="linkbtn" id="againBtn">이 레슨 다시 하기</button>
  </div>`;
  petalsOn();
  $('#homeBtn').onclick=()=>{ sfx('tap'); if(fin) renderFinish(fin); else renderHome(); };
  $('#againBtn').onclick=replay;
  window.scrollTo(0,0);
}
function renderFail(){
  sfx('fail');
  const wl=uniqWrong();
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock('sad','再',132,true)}
    <h2>하트를 모두 잃었어요</h2>
    <p class="sub">${G.cleared}문제를 맞혔어요. 놓친 표현을 확인하고<br>같은 레슨에 다시 도전해 보세요.</p>
    ${wl.length?`<div class="review"><h3>이번에 놓친 표현</h3><ul>${wl.map(w=>
      `<li><span class="j">${esc(w.j)}</span><span class="k">${esc(w.m)}</span></li>`).join('')}</ul></div>`:''}
    <div style="width:100%"><button class="cta" id="retryBtn">다시 도전하기</button></div>
    <button class="linkbtn" id="backBtn">학습 지도로 돌아가기</button>
  </div>`;
  petalsOff();
  $('#retryBtn').onclick=replay;
  $('#backBtn').onclick=()=>{ sfx('tap'); renderHome(); };
  window.scrollTo(0,0);
}
function replay(){
  if(G.lesson.isReview){
    FREE_MODE=false;
    if(G.lesson.id==='__srs') startSrs();
    else if(G.lesson.id==='__free') startFree();
    else startReview();
  }
  else startLesson(LESSONS.find(l=>l.id===G.lesson.id));
}

/* ---------------- 9. SHEET ---------------- */
function openSheet(title, text, primaryLabel, primaryFn, secondaryLabel, secondaryFn){
  closeSheet();
  const bg=document.createElement('div'); bg.className='sheet-bg'; bg.id='sheetBg';
  const sh=document.createElement('div'); sh.className='sheet'; sh.id='sheet';
  sh.innerHTML=`<h3>${esc(title)}</h3><p>${esc(text)}</p>
    <button class="cta shu" id="sheetP">${esc(primaryLabel)}</button>
    <button class="linkbtn" id="sheetS" style="width:100%">${esc(secondaryLabel)}</button>`;
  document.body.append(bg, sh);
  requestAnimationFrame(()=>sh.classList.add('show'));
  bg.onclick=closeSheet;
  sh.querySelector('#sheetP').onclick=primaryFn;
  sh.querySelector('#sheetS').onclick=secondaryFn;
}
function closeSheet(){
  const bg=$('#sheetBg'), sh=$('#sheet');
  if(sh){ sh.classList.remove('show'); setTimeout(()=>sh.remove(),300); }
  if(bg) bg.remove();
}

/* ---------------- 10. START ---------------- */
CLOUD.on(()=>{ if(document.querySelector('.path')) renderHome(); });
CLOUD.init();
initCanvases();
renderHome();
/* browsers require a gesture before audio; unlock on the first tap */
addEventListener('pointerdown', function unlock(){
  ac();
  if(S.bgmOn) setMusic(true);
  removeEventListener('pointerdown', unlock);
}, {once:false});
</script>
